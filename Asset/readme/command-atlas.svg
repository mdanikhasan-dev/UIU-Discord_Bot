<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">UIU BOT command atlas</title>
  <desc id="desc">Six public Discord commands orbit the bot core, with two administrator delivery controls on a protected rail.</desc>
  <defs>
    <radialGradient id="atlasBg" cx="48%" cy="45%"><stop stop-color="#172941"/><stop offset="1" stop-color="#07111f"/></radialGradient>
    <filter id="atlasGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="atlasGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b5c4d8" stroke-opacity=".05"/></pattern>
    <style>
      .orbit { animation: spin 42s linear infinite; transform-origin: 780px 395px; }
      .core { animation: core 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes core { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .orbit,.core { animation: none; } }
    </style>
  </defs>

  <rect width="1600" height="760" rx="30" fill="url(#atlasBg)"/>
  <rect width="1600" height="760" rx="30" fill="url(#atlasGrid)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="62" y="62" fill="#f3a712" font-size="17" font-weight="800" letter-spacing="5">COMMAND ATLAS / 08 ROUTES</text>
    <text x="62" y="111" fill="#f8fafc" font-size="40" font-weight="800">Ask, fetch, decide, configure.</text>
    <text x="62" y="144" fill="#8fa0b8" font-size="17">Public commands orbit the core. Delivery controls stay on the admin rail.</text>

    <circle class="orbit" cx="780" cy="420" r="215" fill="none" stroke="#53657e" stroke-width="2" stroke-dasharray="7 17"/>
    <circle cx="780" cy="420" r="130" fill="#101f34" stroke="#334864" stroke-width="2"/>
    <circle class="core" cx="780" cy="420" r="92" fill="#5865f2" fill-opacity=".16" stroke="#8390ff" stroke-width="2"/>
    <path d="M748 400c15-14 49-14 64 0l-5 43c-17 12-37 12-54 0l-5-43Z" fill="#f8fafc"/>
    <circle cx="766" cy="415" r="5" fill="#5865f2"/><circle cx="794" cy="415" r="5" fill="#5865f2"/>
    <path d="M765 432c10 6 20 6 30 0" fill="none" stroke="#5865f2" stroke-width="4" stroke-linecap="round"/>
    <text x="780" y="492" text-anchor="middle" fill="#dce4ff" font-size="15" font-weight="800" letter-spacing="3">UIU BOT CORE</text>

    <g transform="translate(92 218)">
      <rect width="300" height="96" rx="19" fill="#112139" stroke="#334b69"/>
      <circle cx="45" cy="48" r="23" fill="#243a57"/><path d="M37 48h16M45 40v16" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <text x="83" y="41" fill="#fff" font-size="20" font-weight="800">/notices</text>
      <text x="83" y="66" fill="#8fa0b8" font-size="14">latest three links</text>
      <path d="M300 48H482" stroke="#435a78" stroke-width="2"/>
    </g>
    <g transform="translate(92 349)">
      <rect width="300" height="96" rx="19" fill="#112139" stroke="#334b69"/>
      <circle cx="45" cy="48" r="23" fill="#243a57"/><rect x="35" y="37" width="20" height="22" rx="3" fill="none" stroke="#aeb7ff" stroke-width="3"/><path d="M35 44h20" stroke="#aeb7ff" stroke-width="3"/>
      <text x="83" y="41" fill="#fff" font-size="20" font-weight="800">/calendar</text>
      <text x="83" y="66" fill="#8fa0b8" font-size="14">maintained dates</text>
      <path d="M300 48H482" stroke="#435a78" stroke-width="2"/>
    </g>
    <g transform="translate(92 480)">
      <rect width="300" height="96" rx="19" fill="#112139" stroke="#334b69"/>
      <circle cx="45" cy="48" r="23" fill="#243a57"/><path d="M35 55V46M45 55V38M55 55V43" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round"/>
      <text x="83" y="41" fill="#fff" font-size="20" font-weight="800">/poll</text>
      <text x="83" y="66" fill="#8fa0b8" font-size="14">2–10 options</text>
      <path d="M300 48H482" stroke="#435a78" stroke-width="2"/>
    </g>

    <g transform="translate(1168 218)">
      <path d="M-182 48H0" stroke="#435a78" stroke-width="2"/>
      <rect width="300" height="96" rx="19" fill="#112139" stroke="#334b69"/>
      <circle cx="45" cy="48" r="23" fill="#243a57"/><path d="M35 51c7-17 13-17 20 0" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/><circle cx="45" cy="40" r="3" fill="#ffd166"/>
      <text x="83" y="41" fill="#fff" font-size="20" font-weight="800">/ping</text>
      <text x="83" y="66" fill="#8fa0b8" font-size="14">Discord latency</text>
    </g>
    <g transform="translate(1168 349)">
      <path d="M-182 48H0" stroke="#435a78" stroke-width="2"/>
      <rect width="300" height="96" rx="19" fill="#112139" stroke="#334b69"/>
      <circle cx="45" cy="48" r="23" fill="#243a57"/><circle cx="45" cy="48" r="11" fill="none" stroke="#aeb7ff" stroke-width="3"/><path d="M45 45v10M45 39v1" stroke="#aeb7ff" stroke-width="3" stroke-linecap="round"/>
      <text x="83" y="41" fill="#fff" font-size="20" font-weight="800">/about</text>
      <text x="83" y="66" fill="#8fa0b8" font-size="14">identity + invite</text>
    </g>
    <g transform="translate(1168 480)">
      <path d="M-182 48H0" stroke="#435a78" stroke-width="2"/>
      <rect width="300" height="96" rx="19" fill="#112139" stroke="#334b69"/>
      <circle cx="45" cy="48" r="23" fill="#243a57"/><path d="M38 42c1-8 14-8 14 1 0 6-7 6-7 11M45 60v1" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
      <text x="83" y="41" fill="#fff" font-size="20" font-weight="800">/help</text>
      <text x="83" y="66" fill="#8fa0b8" font-size="14">private guide</text>
    </g>

    <g transform="translate(490 642)">
      <rect width="580" height="74" rx="20" fill="#231c13" stroke="#f3a712" stroke-opacity=".65"/>
      <rect x="18" y="18" width="86" height="38" rx="19" fill="#f3a712"/>
      <text x="61" y="43" text-anchor="middle" fill="#15100a" font-size="13" font-weight="900" letter-spacing="2">ADMIN</text>
      <text x="133" y="34" fill="#fff" font-size="19" font-weight="800">/setup #channel</text>
      <text x="133" y="55" fill="#b9a987" font-size="13">choose delivery</text>
      <path d="M350 18v38" stroke="#634f2d"/>
      <text x="379" y="34" fill="#fff" font-size="19" font-weight="800">/stop_notices</text>
      <text x="379" y="55" fill="#b9a987" font-size="13">end delivery</text>
    </g>

    <rect x="1314" y="54" width="220" height="42" rx="21" fill="#13243a" stroke="#314967"/>
    <circle cx="1342" cy="75" r="7" fill="#5865f2" filter="url(#atlasGlow)"/>
    <text x="1360" y="81" fill="#b9c5ff" font-size="14" font-weight="800" letter-spacing="2">6 PUBLIC / 2 ADMIN</text>
  </g>
</svg>
