<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">UIU BOT — campus notice courier</title>
  <desc id="desc">An animated navy and amber command banner showing UIU notices traveling into Discord.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0c1b31"/>
      <stop offset="1" stop-color="#12182a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#f3a712"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b9cff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9fb0c8" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .route { stroke-dasharray: 18 16; animation: route 4s linear infinite; }
      .ping { animation: ping 2.4s ease-out infinite; transform-origin: center; }
      .ping.delay { animation-delay: 1.2s; }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      @keyframes route { to { stroke-dashoffset: -68; } }
      @keyframes ping { 0% { opacity: .9; transform: scale(.65); } 70%,100% { opacity: 0; transform: scale(1.65); } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .route,.ping,.blink { animation: none; } }
    </style>
  </defs>

  <rect width="1600" height="460" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="30" fill="url(#grid)"/>
  <path d="M0 372C340 314 493 454 760 375s507-93 840-28v113H0Z" fill="#050b14" fill-opacity=".56"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="74" y="64" fill="#f7b733" font-size="18" font-weight="700" letter-spacing="5">UNITED INTERNATIONAL UNIVERSITY / DISCORD UTILITY</text>
    <text x="70" y="202" fill="#f8fafc" font-size="116" font-weight="800" letter-spacing="-5">UIU BOT</text>
    <text x="76" y="255" fill="#aebed3" font-size="28" font-weight="500" letter-spacing="6">CAMPUS NOTICE COURIER</text>
    <rect x="76" y="288" width="632" height="2" fill="url(#amber)"/>

    <g transform="translate(76 326)">
      <text fill="#718096" font-size="14" font-weight="700" letter-spacing="3">SOURCE</text>
      <text y="29" fill="#e5edf7" font-size="17" font-weight="600">UIU notice board</text>
    </g>
    <g transform="translate(304 326)">
      <text fill="#718096" font-size="14" font-weight="700" letter-spacing="3">PULSE</text>
      <text y="29" fill="#e5edf7" font-size="17" font-weight="600">every 05 minutes</text>
    </g>
    <g transform="translate(548 326)">
      <text fill="#718096" font-size="14" font-weight="700" letter-spacing="3">DELIVERY</text>
      <text y="29" fill="#e5edf7" font-size="17" font-weight="600">configured channel</text>
    </g>
  </g>

  <g transform="translate(867 56)">
    <circle cx="280" cy="174" r="154" fill="#0a1323" stroke="#31415a" stroke-width="2"/>
    <circle cx="280" cy="174" r="116" fill="none" stroke="#3f5271" stroke-dasharray="5 12"/>
    <circle cx="280" cy="174" r="75" fill="#111e33" stroke="#f3a712" stroke-width="2"/>
    <path d="M251 157c14-13 44-13 58 0l-5 39c-15 11-33 11-48 0l-5-39Z" fill="#f8fafc"/>
    <circle cx="267" cy="171" r="5" fill="#5865f2"/>
    <circle cx="293" cy="171" r="5" fill="#5865f2"/>
    <path d="M265 186c10 6 20 6 30 0" fill="none" stroke="#5865f2" stroke-width="4" stroke-linecap="round"/>
    <circle class="ping" cx="280" cy="174" r="76" fill="none" stroke="#f3a712" stroke-width="3"/>
    <circle class="ping delay" cx="280" cy="174" r="76" fill="none" stroke="#5865f2" stroke-width="3"/>

    <path class="route" d="M0 88C72 88 89 174 164 174" fill="none" stroke="url(#amber)" stroke-width="4"/>
    <path class="route" d="M396 174C465 174 474 266 555 266" fill="none" stroke="url(#violet)" stroke-width="4"/>

    <g transform="translate(-6 52)">
      <rect width="118" height="72" rx="15" fill="#111d2f" stroke="#f3a712"/>
      <path d="M24 22h69v34H24zM24 23l34 23 35-23" fill="none" stroke="#ffd166" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g transform="translate(446 230)">
      <rect width="126" height="74" rx="17" fill="#111d2f" stroke="#7080ff"/>
      <circle cx="31" cy="36" r="15" fill="#5865f2"/>
      <path d="M22 33c6-5 13-5 19 0l-2 12c-6 4-11 4-16 0l-1-12Z" fill="#fff"/>
      <path d="M57 28h46M57 43h35" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle class="blink" cx="167" cy="174" r="8" fill="#ffd166" filter="url(#glow)"/>
    <circle class="blink" cx="397" cy="174" r="8" fill="#8b9cff" filter="url(#glow)"/>
  </g>

  <rect x="1342" y="44" width="186" height="44" rx="22" fill="#14243c" stroke="#2e405c"/>
  <circle class="blink" cx="1370" cy="66" r="7" fill="#4ade80"/>
  <text x="1390" y="72" fill="#cdd8e8" font-family="Segoe UI, Arial" font-size="16" font-weight="700" letter-spacing="2">SIGNAL READY</text>
</svg>
