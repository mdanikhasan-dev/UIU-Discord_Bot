<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title description">
  <title id="title">UIU BOT notice relay</title>
  <desc id="description">An animated route showing a UIU notice becoming a Discord channel update.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#20293a"/>
    </linearGradient>
    <linearGradient id="route" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset=".5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#7289da"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .packet { animation: travel 4.8s ease-in-out infinite; }
      .ring { animation: ring 4.8s ease-out infinite; transform-origin: 944px 90px; }
      .soft { animation: breathe 2.4s ease-in-out infinite; }
      @keyframes travel { 0%, 10% { transform: translateX(0); opacity: 0; } 16% { opacity: 1; } 70% { transform: translateX(644px); opacity: 1; } 82%, 100% { transform: translateX(644px); opacity: 0; } }
      @keyframes ring { 0%, 72% { opacity: 0; transform: scale(.72); } 80% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }
      @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .packet, .ring, .soft { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="180" rx="24" fill="url(#surface)"/>
  <path d="M78 90H1122" stroke="#64748b" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 10"/>
  <path d="M278 90H922" stroke="url(#route)" stroke-width="3" filter="url(#glow)"/>

  <g transform="translate(58 43)">
    <rect width="220" height="94" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity=".85"/>
    <rect x="20" y="21" width="13" height="52" rx="6.5" fill="#f59e0b"/>
    <path d="M49 34H175M49 49H202M49 64H151" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <text x="20" y="120" fill="#fbbf24" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">UIU NOTICE BOARD</text>
  </g>

  <g transform="translate(510 31)">
    <circle cx="90" cy="59" r="50" fill="#151d2f" stroke="#94a3b8" stroke-opacity=".45"/>
    <circle cx="90" cy="59" r="38" fill="#5865f2"/>
    <path d="M68 49c11-9 43-9 44 0l-4 24c-11 8-25 8-36 0l-4-24Z" fill="#fff"/>
    <circle cx="80" cy="58" r="4" fill="#5865f2"/><circle cx="100" cy="58" r="4" fill="#5865f2"/>
    <path d="M79 68c7 4 15 4 22 0" fill="none" stroke="#5865f2" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="142" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">UIU BOT</text>
    <text x="90" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.7">CHECKS / REMEMBERS / SENDS</text>
  </g>

  <g class="packet" transform="translate(278 0)">
    <circle cx="0" cy="90" r="9" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="0" cy="90" r="3" fill="#fff"/>
  </g>

  <g transform="translate(922 43)">
    <rect width="220" height="94" rx="16" fill="#10151f" stroke="#7289da" stroke-opacity=".9"/>
    <circle cx="30" cy="32" r="12" fill="#5865f2"/>
    <path d="M23 31c4-4 10-4 14 0l-1 8c-4 3-8 3-12 0l-1-8Z" fill="#fff"/>
    <rect x="52" y="23" width="106" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="52" y="43" width="147" height="7" rx="3.5" fill="#93c5fd"/>
    <rect x="52" y="58" width="123" height="7" rx="3.5" fill="#64748b"/>
    <text x="20" y="120" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">YOUR DISCORD CHANNEL</text>
  </g>

  <circle class="ring" cx="944" cy="75" r="20" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  <text x="600" y="21" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" letter-spacing="3">FRESH NOTICE DETECTED</text>
</svg>
