<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">UIU BOT profile console</title>
  <desc id="desc">The original UIU BOT courier identity beside its live Discord profile and operating details.</desc>
  <defs>
    <linearGradient id="profileBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#17233a"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#f3a712" stop-opacity=".3"/><stop offset=".6" stop-color="#5865f2" stop-opacity=".11"/><stop offset="1" stop-color="#07111f" stop-opacity="0"/></radialGradient>
    <linearGradient id="profileLine" x1="0" x2="1"><stop stop-color="#f3a712"/><stop offset=".52" stop-color="#ffd166"/><stop offset=".53" stop-color="#5865f2"/><stop offset="1" stop-color="#8b9cff"/></linearGradient>
    <pattern id="profileGrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#a9b9d0" stroke-opacity=".055"/></pattern>
    <filter id="profileGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="robotShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000713" flood-opacity=".52"/></filter>
    <style>
      .online { animation: online 2.2s ease-in-out infinite; }
      .trace { stroke-dasharray: 13 11; animation: trace 3.6s linear infinite; }
      @keyframes online { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes trace { to { stroke-dashoffset: -48; } }
      @media (prefers-reduced-motion: reduce) { .online,.trace { animation: none; } }
    </style>
  </defs>

  <rect width="1600" height="650" rx="30" fill="url(#profileBg)"/>
  <rect width="1600" height="650" rx="30" fill="url(#profileGrid)"/>
  <circle cx="344" cy="300" r="315" fill="url(#halo)"/>
  <path d="M610 0h990v650H545c97-129 130-251 65-650Z" fill="#0b1627" fill-opacity=".55"/>

  <ellipse cx="318" cy="569" rx="230" ry="35" fill="#020712" opacity=".55"/>
  <image href="uiu-bot-messenger.png" x="45" y="5" width="570" height="570" preserveAspectRatio="xMidYMid meet" filter="url(#robotShadow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="64" y="62" fill="#f3a712" font-size="16" font-weight="800" letter-spacing="5">ORIGINAL IDENTITY / COURIER–01</text>
    <rect x="72" y="522" width="486" height="62" rx="18" fill="#101d30" stroke="#334762"/>
    <circle class="online" cx="106" cy="553" r="9" fill="#4ade80" filter="url(#profileGlow)"/>
    <text x="132" y="549" fill="#8da0b9" font-size="12" font-weight="800" letter-spacing="3">MISSION</text>
    <text x="132" y="571" fill="#f0f4fa" font-size="15" font-weight="700">Carry the notice. Keep the source.</text>

    <g transform="translate(690 64)">
      <text fill="#8798b0" font-size="14" font-weight="800" letter-spacing="4">DISCORD BOT PROFILE / LIVE IDENTITY</text>
      <rect x="734" y="-15" width="140" height="42" rx="21" fill="#11243a" stroke="#36506e"/>
      <circle class="online" cx="762" cy="6" r="7" fill="#4ade80"/>
      <text x="782" y="12" fill="#d6e0ee" font-size="13" font-weight="800" letter-spacing="2">ONLINE</text>

      <text y="105" fill="#f8fafc" font-size="72" font-weight="800" letter-spacing="-2">UIU BOT</text>
      <rect x="300" y="59" width="82" height="46" rx="13" fill="#5865f2"/>
      <text x="341" y="89" text-anchor="middle" fill="#fff" font-size="16" font-weight="900" letter-spacing="2">APP</text>
      <text y="144" fill="#8798b0" font-size="16" font-weight="700" letter-spacing="3">UIU BOT#0676</text>
      <text y="201" fill="#ced8e6" font-size="24" font-weight="600">Your own soft place for notices, updates,</text>
      <text y="234" fill="#ced8e6" font-size="24" font-weight="600">and community info.</text>

      <rect y="275" width="270" height="105" rx="18" fill="#111f33" stroke="#31445e"/>
      <text x="24" y="307" fill="#7f91a9" font-size="12" font-weight="800" letter-spacing="3">ROLE</text>
      <text x="24" y="342" fill="#fff" font-size="20" font-weight="750">Notice courier</text>
      <text x="24" y="365" fill="#93a3b9" font-size="13">campus → Discord</text>

      <rect x="291" y="275" width="270" height="105" rx="18" fill="#111f33" stroke="#31445e"/>
      <text x="315" y="307" fill="#7f91a9" font-size="12" font-weight="800" letter-spacing="3">COMMANDS</text>
      <text x="315" y="342" fill="#fff" font-size="20" font-weight="750">08 synced</text>
      <text x="315" y="365" fill="#93a3b9" font-size="13">6 public / 2 admin</text>

      <rect x="582" y="275" width="270" height="105" rx="18" fill="#111f33" stroke="#31445e"/>
      <text x="606" y="307" fill="#7f91a9" font-size="12" font-weight="800" letter-spacing="3">DELIVERY</text>
      <text x="606" y="342" fill="#fff" font-size="20" font-weight="750">Opt-in</text>
      <text x="606" y="365" fill="#93a3b9" font-size="13">admin chooses channel</text>

      <rect y="410" width="852" height="92" rx="20" fill="#08121f" stroke="#30445f"/>
      <text x="28" y="444" fill="#f3a712" font-size="12" font-weight="900" letter-spacing="3">SIGNAL PATH</text>
      <text x="28" y="477" fill="#f0f4fa" font-size="17" font-weight="800">UIU NOTICE BOARD</text>
      <text x="275" y="477" fill="#687b96" font-size="17">→</text>
      <text x="330" y="477" fill="#f0f4fa" font-size="17" font-weight="800">SERVER MEMORY</text>
      <text x="556" y="477" fill="#687b96" font-size="17">→</text>
      <text x="610" y="477" fill="#f0f4fa" font-size="17" font-weight="800">DISCORD CHANNEL</text>
      <path class="trace" d="M28 515H824" stroke="url(#profileLine)" stroke-width="3"/>
    </g>
  </g>
</svg>
