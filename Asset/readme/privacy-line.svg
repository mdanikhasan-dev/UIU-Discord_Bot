<svg width="1400" height="250" viewBox="0 0 1400 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UIU Bot privacy line</title>
  <desc id="desc">UIU Bot is independent, does not ask for UCAM credentials, and keeps private interaction data ephemeral.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="0" x2="1350" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17100A"/>
      <stop offset="0.48" stop-color="#151A2B"/>
      <stop offset="1" stop-color="#081B19"/>
    </linearGradient>
    <linearGradient id="rule" x1="76" y1="184" x2="1324" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F39200"/>
      <stop offset="0.52" stop-color="#6F91FF"/>
      <stop offset="1" stop-color="#45D69A"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="250" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="24" r="150" fill="#2CB67D" fill-opacity="0.09"/>
  <circle cx="96" cy="246" r="180" fill="#F39200" fill-opacity="0.08"/>
  <path d="M76 184H1324" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(78 55)">
    <rect x="0" y="16" width="55" height="44" rx="12" stroke="#F39200" stroke-width="4"/>
    <path d="M14 16V11C14 2.716 20.716 -4 29 -4H31C39.284 -4 46 2.716 46 11V16" stroke="#F39200" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="38" r="5" fill="#F39200"/>
    <path d="M28 43V51" stroke="#F39200" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="172" y="76" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">PRIVATE BY DEFAULT</text>
  <text x="172" y="110" fill="#A8B6D0" font-family="Arial, Helvetica, sans-serif" font-size="18">The useful boundary is part of the product.</text>

  <text x="78" y="218" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">No UCAM login</text>
  <text x="78" y="240" fill="#A8B6D0" font-family="Arial, Helvetica, sans-serif" font-size="17">independent software</text>
  <text x="520" y="218" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Ephemeral sessions</text>
  <text x="520" y="240" fill="#A8B6D0" font-family="Arial, Helvetica, sans-serif" font-size="17">grades and summaries are not saved</text>
  <text x="1010" y="218" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AI is opt-in</text>
  <text x="1010" y="240" fill="#A8B6D0" font-family="Arial, Helvetica, sans-serif" font-size="17">local summary first</text>
</svg>
