<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">UIU BOT notice board and dispatch console</title>
  <desc id="desc">An example UIU notice list flows through fetch, compare, and deliver stages into Discord.</desc>
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ea"/><stop offset="1" stop-color="#e7edf6"/></linearGradient>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1425"/><stop offset="1" stop-color="#17263e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1322" flood-opacity=".16"/></filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#15253d" opacity=".06"/></pattern>
    <style>
      .runner { animation: runner 5s ease-in-out infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes runner { 0%,8% { transform: translateX(0); opacity: 0; } 16% { opacity: 1; } 78% { transform: translateX(522px); opacity: 1; } 90%,100% { transform: translateX(522px); opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .32; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .runner,.pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1600" height="820" rx="30" fill="url(#boardBg)"/>
  <rect width="1600" height="820" rx="30" fill="url(#paper)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="64" y="66" fill="#15253d" font-size="18" font-weight="800" letter-spacing="5">UIU BOT / INTERFACE STUDY 01</text>
    <text x="64" y="124" fill="#0b1628" font-size="48" font-weight="800">Notice board → Discord dispatch</text>
    <text x="64" y="158" fill="#617087" font-size="18">An honest example of the route. Live titles always come from the source page.</text>

    <g transform="translate(64 198)" filter="url(#shadow)">
      <rect width="985" height="554" rx="26" fill="#fffdf8"/>
      <rect width="985" height="82" rx="26" fill="#fff8e8"/>
      <rect y="56" width="985" height="26" fill="#fff8e8"/>
      <circle cx="36" cy="41" r="12" fill="#f3a712"/>
      <text x="61" y="34" fill="#16243a" font-size="15" font-weight="800" letter-spacing="3">UIU NOTICE BOARD</text>
      <text x="61" y="58" fill="#6f7b8c" font-size="14">www.uiu.ac.bd/notice/</text>
      <rect x="770" y="23" width="184" height="38" rx="19" fill="#14253d"/>
      <circle class="pulse" cx="795" cy="42" r="6" fill="#4ade80"/>
      <text x="813" y="48" fill="#eaf1fb" font-size="13" font-weight="700" letter-spacing="2">SOURCE ONLINE</text>

      <g transform="translate(30 112)">
        <rect width="925" height="118" rx="18" fill="#f8fafc" stroke="#dce4ef"/>
        <rect width="8" height="118" rx="4" fill="#f3a712"/>
        <text x="32" y="31" fill="#9a6700" font-size="12" font-weight="800" letter-spacing="2">ACADEMIC / EXAMPLE</text>
        <text x="32" y="64" fill="#13233b" font-size="23" font-weight="700">Academic calendar update</text>
        <text x="32" y="91" fill="#6e7c90" font-size="15">Original title and URL are preserved in the Discord message.</text>
        <rect x="761" y="39" width="134" height="42" rx="21" fill="#fff1c9"/>
        <text x="790" y="66" fill="#8b5a00" font-size="14" font-weight="800">OPEN ↗</text>
      </g>
      <g transform="translate(30 246)">
        <rect width="925" height="118" rx="18" fill="#f8fafc" stroke="#dce4ef"/>
        <rect width="8" height="118" rx="4" fill="#5865f2"/>
        <text x="32" y="31" fill="#4b57c8" font-size="12" font-weight="800" letter-spacing="2">REGISTRATION / EXAMPLE</text>
        <text x="32" y="64" fill="#13233b" font-size="23" font-weight="700">Course registration notice</text>
        <text x="32" y="91" fill="#6e7c90" font-size="15">The on-demand command shows the three newest notice-board items.</text>
        <rect x="761" y="39" width="134" height="42" rx="21" fill="#e8eaff"/>
        <text x="790" y="66" fill="#4854ca" font-size="14" font-weight="800">OPEN ↗</text>
      </g>
      <g transform="translate(30 380)">
        <rect width="925" height="118" rx="18" fill="#f8fafc" stroke="#dce4ef"/>
        <rect width="8" height="118" rx="4" fill="#15a37a"/>
        <text x="32" y="31" fill="#0f8060" font-size="12" font-weight="800" letter-spacing="2">CAMPUS / EXAMPLE</text>
        <text x="32" y="64" fill="#13233b" font-size="23" font-weight="700">Campus service update</text>
        <text x="32" y="91" fill="#6e7c90" font-size="15">Automatic delivery only sends links this server has not seen.</text>
        <rect x="761" y="39" width="134" height="42" rx="21" fill="#dff8ef"/>
        <text x="790" y="66" fill="#08785a" font-size="14" font-weight="800">OPEN ↗</text>
      </g>
    </g>

    <g transform="translate(1081 198)" filter="url(#shadow)">
      <rect width="455" height="554" rx="26" fill="url(#darkPanel)"/>
      <text x="30" y="46" fill="#f5f7fb" font-size="16" font-weight="800" letter-spacing="4">DISPATCH LOG</text>
      <text x="30" y="73" fill="#8092ac" font-size="14">One loop. Three deliberate stages.</text>

      <path d="M55 124V374" stroke="#3d4e68" stroke-width="3"/>
      <g transform="translate(30 112)">
        <circle cx="25" cy="19" r="17" fill="#f3a712"/>
        <text x="25" y="25" text-anchor="middle" fill="#111827" font-size="13" font-weight="900">1</text>
        <text x="69" y="15" fill="#ffd166" font-size="13" font-weight="800" letter-spacing="2">FETCH</text>
        <text x="69" y="40" fill="#e4ebf5" font-size="17" font-weight="600">Read the newest links</text>
        <text x="69" y="63" fill="#8fa0b8" font-size="13">Up to five items per request</text>
      </g>
      <g transform="translate(30 221)">
        <circle cx="25" cy="19" r="17" fill="#5865f2"/>
        <text x="25" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="900">2</text>
        <text x="69" y="15" fill="#aeb7ff" font-size="13" font-weight="800" letter-spacing="2">COMPARE</text>
        <text x="69" y="40" fill="#e4ebf5" font-size="17" font-weight="600">Check server memory</text>
        <text x="69" y="63" fill="#8fa0b8" font-size="13">Skip every URL already seen</text>
      </g>
      <g transform="translate(30 330)">
        <circle cx="25" cy="19" r="17" fill="#15a37a"/>
        <text x="25" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="900">3</text>
        <text x="69" y="15" fill="#6ee7b7" font-size="13" font-weight="800" letter-spacing="2">DELIVER</text>
        <text x="69" y="40" fill="#e4ebf5" font-size="17" font-weight="600">Post oldest-first</text>
        <text x="69" y="63" fill="#8fa0b8" font-size="13">Then remember the sent URL</text>
      </g>

      <rect x="30" y="446" width="395" height="77" rx="17" fill="#0b1423" stroke="#354761"/>
      <text x="54" y="476" fill="#7f91aa" font-size="12" font-weight="800" letter-spacing="2">NEXT CHECK</text>
      <text x="54" y="506" fill="#fff" font-size="22" font-weight="700">in 05 minutes</text>
      <circle class="pulse" cx="389" cy="484" r="10" fill="#4ade80" filter="url(#dotGlow)"/>
    </g>

    <path d="M940 181H1462" stroke="#b3bdcb" stroke-width="3" stroke-dasharray="7 11"/>
    <g class="runner" transform="translate(940 181)"><circle r="9" fill="#f3a712" filter="url(#dotGlow)"/><circle r="3" fill="#fff"/></g>
  </g>
</svg>
